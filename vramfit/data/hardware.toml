# Offline hardware database for vramfit. Add your own GPUs and CPU
# presets here, or drop a hardware.toml in your working directory to
# override or extend this list.

schema_version = 1

[headroom]
gpu_fraction = 0.95
cpu_fraction = 0.90
swap_fraction = 0.85

# Rough decode bandwidth in GB/s, used only for the speed estimate.

[gpus."rtx-4090"]
name = "NVIDIA RTX 4090"
