# Offline model database for vramfit.
# Sizes are approximate published parameter counts and architecture values
# for common open-weight models. All figures are decimal GB.
# Add your own entries here, or drop a models.toml in your working
# directory to override or extend this list. Required fields per model:
#   params_b, layers, kv_head_dim, max_context

schema_version = 1

# Bits per weight for common GGUF-style quants (effective, including
# embedding/lm-head rounding). Order = quality order, best first.
[quants.fp16]
bits_per_weight = 16.0
quality = "reference quality, largest file"

[quants.q8]
bits_per_weight = 8.5
quality = "near-lossless"

[quants.q6]
bits_per_weight = 6.6
quality = "excellent, hard to tell from fp16 in chat use"

[quants.q5]
bits_per_weight = 5.5
quality = "very good"

[quants.q4]
bits_per_weight = 4.7
quality = "good, the usual everyday sweet spot"

[quants.q3]
bits_per_weight = 3.9
quality = "noticeably degraded on some tasks"

[quants.q2]
bits_per_weight = 3.1
quality = "rough-draft quality, use only to squeeze onto tiny hardware"

[overheads]
gpu_gb = 1.2
cpu_gb = 0.4

# Context lengths considered when suggesting a setup.
context_ladder = [512, 1024, 2048, 4096, 8192, 12288, 16384, 24576, 32768, 49152, 65536, 81920, 98304, 131072]

# kv_head_dim = number of KV heads x head dimension (GQA-aware).

