[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vramfit"
version = "1.0.0"
description = "Offline 'can I run this model?' VRAM/RAM fitter with an extensible TOML model database"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
requires-python = ">=3.11"
keywords = ["llm", "vram", "gguf", "quantization", "offline", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
[project.scripts]
vramfit = "vramfit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["vramfit"]

[tool.setuptools.package-data]
vramfit = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
